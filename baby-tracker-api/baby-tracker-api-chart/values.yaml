replicaCount: 1
image:
  repository: localhost/tracker
  pullPolicy: IfNotPresent
  tag: latest
podAnnotations: {}
podLabels: {}
service:
  type: ClusterIP
  containerPort: 8080
  port: 80
resources:
   limits:
     cpu: 1
     memory: 512Mi
   requests:
     cpu: 1
     memory: 512Mi
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

httpRoute:
  enabled: false
ingress:
  enabled: false